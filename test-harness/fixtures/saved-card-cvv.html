<!doctype html>
<!-- Fixture: a SAVED card is on file (VISA ····1561) but Nike still requires the
     CVV / "Security code" typed before CONTINUE. isPaymentAlreadyComplete() is
     true (card on file), yet findSecurityCodeInput() must find the empty field
     and the machine must type the account's CVV into it. -->
<html lang="en">
<head><meta charset="utf-8"><title>GS Checkout — saved card + CVV</title></head>
<body>
  <main class="checkout">
    <section class="category delivery-section">
      <h2>DELIVERY</h2>
      <div class="summary">1 Pearl Bank 26-18, 169016</div>
    </section>

    <section class="category payment-section">
      <h2>PAYMENT</h2>
      <div class="saved-card-row">
        <span class="brand">VISA</span>
        <span class="last4">1561</span>
        <!-- EXACT attributes from a real Nike/eShopWorld saved-card checkout:
             name="cardCvc", id="cardCvc-input", cccvc marker, numeric pattern,
             NO placeholder/aria-label matching "cvv"/"security code". -->
        <input class="cvv-input form-control" type="tel" name="cardCvc" id="cardCvc-input"
               autocomplete="off" required minlength="3" maxlength="4"
               pattern="[0-9]{4}|[0-9]{3}" cccvc="">
      </div>
      <label><input type="checkbox" checked> Billing address is the same as delivery address</label>
      <button class="button-continue" type="button">Continue</button>
    </section>

    <!-- SUBMIT appears after the payment section is committed (green tick). -->
    <button class="button-submit" type="button" style="display:none;">Submit Order</button>
  </main>

  <script>
    // Mimic Nike: CONTINUE only commits once the CVV has 3+ digits; committing
    // collapses PAYMENT and reveals SUBMIT ORDER.
    document.querySelector(".button-continue").addEventListener("click", function () {
      var cvv = (document.getElementById("cardCvc-input").value || "").replace(/\D/g, "");
      if (cvv.length >= 3) {
        this.style.display = "none";
        document.querySelector(".button-submit").style.display = "";
      }
    });
  </script>
</body>
</html>
